plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.halcyon2026928.freewindow'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.halcyon2026928.freewindow"
        // libxposed/api（现代 Xposed API）要求 minSdk 26。
        minSdk 26
        targetSdk 32
        versionCode 32
        versionName "3.9.6"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.forEach { output ->
                output.outputFileName.set("freewindow-${variant.buildType}.apk")
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
