plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.halcyon2026928.freewindow'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.halcyon2026928.freewindow"
        minSdk 21
        targetSdk 34
        versionCode 13
        versionName "2.0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.forEach { output ->
                output.outputFileName.set("freewindow-${variant.buildType}.apk")
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
}
